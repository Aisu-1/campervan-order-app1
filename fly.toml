# fly.toml app configuration file generated for campervan-order-app on 2026-01-09T22:46:02+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'campervan-order-app'
primary_region = 'nrt'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[build.args]
  # VITE_API_KEY = "your_api_key_here"
  # VITE_STAFF_PIN = "your_staff_pin_here"

[env]
  DB_PATH = "/data/campervan.db"
  # STAFF_PIN = "your_staff_pin_here"

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "campervan_data"
  destination = "/data"
